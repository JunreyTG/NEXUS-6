networks:
  datavault6-network:
    name: datavault6-network
    driver: bridge

volumes:
  postgres-system-data:
    name: datavault6-postgres-system-data
  postgres-logs-data:
    name: datavault6-postgres-logs-data
  mysql-data:
    name: datavault6-mysql-data
  sqlserver-data:
    name: datavault6-sqlserver-data
  mongodb-data:
    name: datavault6-mongodb-data
  couchbase-data:
    name: datavault6-couchbase-data
  neo4j-data:
    name: datavault6-neo4j-data

services:
  # ==========================================
  # 1. PostgreSQL System Database (Core Entities)
  # ==========================================
  postgres-system:
    image: postgres:16-alpine
    container_name: datavault6-postgres-system
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SYSTEM_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SYSTEM_PASSWORD:-Password123!}
      POSTGRES_DB: ${POSTGRES_SYSTEM_DB:-nexus_system}
    volumes:
      - postgres-system-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_SYSTEM_PORT:-5434}:5432"
    networks:
      - datavault6-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SYSTEM_USER:-postgres} -d ${POSTGRES_SYSTEM_DB:-nexus_system}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. PostgreSQL Log Database (Activity & Audit Isolation)
  # ==========================================
  postgres-logs:
    image: postgres:16-alpine
    container_name: datavault6-postgres-logs
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_LOGS_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_LOGS_PASSWORD:-Password123!}
      POSTGRES_DB: ${POSTGRES_LOGS_DB:-nexus_logs}
    volumes:
      - postgres-logs-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_LOGS_PORT:-5435}:5432"
    networks:
      - datavault6-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_LOGS_USER:-postgres} -d ${POSTGRES_LOGS_DB:-nexus_logs}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 3. MySQL Database (Relational Engine)
  # ==========================================
  mysql:
    image: mysql:8.4
    container_name: datavault6-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-Nexus6MySQL!2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexus_db}
      MYSQL_USER: ${MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Nexus6MySQL!2026}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - datavault6-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_PASSWORD:-Nexus6MySQL!2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # 4. Microsoft SQL Server (Relational Engine)
  # ==========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: datavault6-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:-YourStrongPassword123!}
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    networks:
      - datavault6-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_PASSWORD:-YourStrongPassword123!}' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_PASSWORD:-YourStrongPassword123!}' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # ==========================================
  # 5. MongoDB (Document Engine)
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: datavault6-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-Nexus6Mongo!2026}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-nexus-6}
    volumes:
      - mongodb-data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - datavault6-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand(\"ping\").ok' localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================
  # 6. Couchbase (Document / Key-Value Engine)
  # ==========================================
  couchbase:
    image: couchbase:community-7.6.2
    container_name: datavault6-couchbase
    restart: unless-stopped
    volumes:
      - couchbase-data:/opt/couchbase/var
    ports:
      - "8091-8096:8091-8096"
      - "11210:11210"
    networks:
      - datavault6-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8091/ui/index.html || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================
  # 7. Neo4j (Graph Engine)
  # ==========================================
  neo4j:
    image: neo4j:5.20-community
    container_name: datavault6-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-xu698WnpSb-vy5a2ShXuSqDfkA6oVcYFq5qMxJgwGFY}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    networks:
      - datavault6-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================
  # 8. DataVault6 API Backend Service (Option B)
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datavault6-api
    restart: unless-stopped
    depends_on:
      postgres-system:
        condition: service_healthy
      postgres-logs:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      SYSTEM_DATABASE_URL: postgresql://${POSTGRES_SYSTEM_USER:-postgres}:${POSTGRES_SYSTEM_PASSWORD:-Password123!}@postgres-system:5432/${POSTGRES_SYSTEM_DB:-nexus_system}
      SYSTEM_DATABASE_DIRECT_URL: postgresql://${POSTGRES_SYSTEM_USER:-postgres}:${POSTGRES_SYSTEM_PASSWORD:-Password123!}@postgres-system:5432/${POSTGRES_SYSTEM_DB:-nexus_system}
      LOG_DATABASE_URL: postgresql://${POSTGRES_LOGS_USER:-postgres}:${POSTGRES_LOGS_PASSWORD:-Password123!}@postgres-logs:5432/${POSTGRES_LOGS_DB:-nexus_logs}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-daplinankaila91@gmail.com}
      SUPER_ADMIN_PASSWORD_HASH: ${SUPER_ADMIN_PASSWORD_HASH:-$$argon2id$$v=19$$m=65536,t=3,p=4$$Sb4hP1AD7hGOUPiTxE3jMQ$$M5Ih7gGIBMzPlXkjJm73xIg5FLvxcDBiM+XS/5RiOe8}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-tSvfUfB+wcBLR+esmYF1Zjl7j+MrSWWQjo5RB4iG6thbl2DJ3u+eP51Uij5F/Jp4dDGxK0GzScIREy2hfPPqIw==}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-10m}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-30}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-brevos}
      EMAIL_FROM: ${EMAIL_FROM:-DataVault6 <daplinankaila91@gmail.com>}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-DataVault6}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-0}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexus_db}
      MYSQL_USER: ${MYSQL_USER:-nexus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Nexus6MySQL!2026}
      POSTGRES_DATA_HOST: postgres-system
      POSTGRES_DATA_PORT: 5432
      POSTGRES_DATA_DATABASE: ${POSTGRES_SYSTEM_DB:-nexus_system}
      POSTGRES_DATA_USER: ${POSTGRES_SYSTEM_USER:-postgres}
      POSTGRES_DATA_PASSWORD: ${POSTGRES_SYSTEM_PASSWORD:-Password123!}
      POSTGRES_DATA_SSL: "false"
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: 1433
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-nexus6_public_data}
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-YourStrongPassword123!}
      SQLSERVER_ENCRYPT: "false"
      SQLSERVER_TRUST_SERVER_CERTIFICATE: "true"
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-Nexus6Mongo!2026}@mongodb:27017/${MONGO_INITDB_DATABASE:-nexus-6}?authSource=admin
      COUCHBASE_CONNECTION_STRING: couchbase://couchbase
      COUCHBASE_USERNAME: ${COUCHBASE_USERNAME:-nexus6}
      COUCHBASE_PASSWORD: ${COUCHBASE_PASSWORD:-Mystery@02}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET:-travel-sample}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-xu698WnpSb-vy5a2ShXuSqDfkA6oVcYFq5qMxJgwGFY}
    ports:
      - "4000:4000"
    networks:
      - datavault6-network
